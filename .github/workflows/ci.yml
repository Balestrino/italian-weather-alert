name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  changelog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Test changelog recorder
        run: python3 -m unittest scripts/test_changelog.py
      - name: Require changelog entry in each change commit
        env:
          CHANGELOG_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: python3 scripts/changelog.py check --base "$CHANGELOG_BASE"
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Test with race detector
        run: go test -race ./...
      - name: Vet
        run: go vet ./...
      - name: Build commands
        run: go build ./cmd/...
      - name: Validate deployment Compose examples
        run: python3 scripts/check-deployment-config.py
      - name: Test environment operations with synthetic fixtures
        run: python3 -m unittest scripts/test_environment_operations.py
