name: Coverage

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Prepare integration test images
        run: |
          docker pull postgres:16-alpine
          docker pull rustfs/rustfs:1.0.0
      - name: Measure Go test coverage
        run: |
          profile="$RUNNER_TEMP/coverage.out"
          go test -tags=integration -p 2 -coverpkg=./cmd/...,./internal/...,./api/... -coverprofile="$profile" ./cmd/... ./internal/... ./api/...
          measured=$(go tool cover -func="$profile" | awk '$1 == "total:" { sub(/%/, "", $3); print $3 }')
          printf 'Go statement coverage: **%s%%** (minimum 66%%)\n' "$measured" >> "$GITHUB_STEP_SUMMARY"
          awk -v measured="$measured" 'BEGIN { if (measured + 0 < 66) { print "Coverage below 66%"; exit 1 } }'
