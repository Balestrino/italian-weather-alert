{{define "guided-fields"}}{{range .}}<label>{{.Label}}{{if eq .Kind "lines"}}<textarea name="{{.Name}}" rows="3" {{if .Required}}required{{end}}>{{.Value}}</textarea>{{else if eq .Kind "coverage"}}<select name="{{.Name}}" required><option value="">Seleziona la copertura</option><option value="accepted_declared_scope">Perimetro dichiarato verificato</option><option value="accepted_with_limitations">Accettata con limitazioni</option></select>{{else if eq .Kind "bool"}}<select name="{{.Name}}"><option value="false">No</option><option value="true">Sì, verificato</option></select>{{else}}<input name="{{.Name}}" type="{{if eq .Kind "number"}}number{{else}}text{{end}}" value="{{.Value}}" {{if .Required}}required{{end}} {{if .Readonly}}readonly{{end}} {{if eq .Kind "number"}}min="0" step="1"{{end}}>{{end}}{{if .Hint}}<span>{{.Hint}}</span>{{end}}</label>{{end}}{{end}}
