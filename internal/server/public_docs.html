<!doctype html>
<html lang="it">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>IWA — API pubbliche</title>
  </head>
  <body>
    <div id="app"><p>Documentazione API IWA — <a href="/openapi.json">scarica la specifica OpenAPI</a>.</p></div>
    <noscript>Abilita JavaScript per consultare la documentazione interattiva.</noscript>
    <script src="https://cdn.jsdelivr.net/npm/@scalar/api-reference@1.72.0/dist/browser/standalone.js"></script>
    <script>
      Scalar.createApiReference('#app', {
        url: '/openapi.json',
        persistAuth: false,
      });
    </script>
  </body>
</html>
